name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball_name }}

    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "mermaid-hillchart..." build

      - name: Test
        run: pnpm --filter "mermaid-hillchart..." test

      - name: Pack npm tarball
        id: pack
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACK_JSON=$(pnpm --filter mermaid-hillchart pack --pack-destination artifacts --json)
          echo "::group::pnpm pack metadata"
          printf '%s\n' "$PACK_JSON"
          echo "::endgroup::"

          PACKAGE_NAME=$(jq -r '.name' <<<"$PACK_JSON")
          PACKAGE_VERSION=$(jq -r '.version' <<<"$PACK_JSON")
          TARBALL_PATH=$(jq -r '.filename' <<<"$PACK_JSON")
          TARBALL_NAME=$(basename "$TARBALL_PATH")
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version $TAG_VERSION does not match packed $PACKAGE_NAME version $PACKAGE_VERSION"
            exit 1
          fi

          printf 'tarball_path=%s\n' "$TARBALL_PATH" >> "$GITHUB_OUTPUT"
          printf 'tarball_name=%s\n' "$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.tarball_path }}
        run: |
          SBOM_PATH="${TARBALL_PATH%.tgz}.cdx.json"
          pnpm --filter mermaid-hillchart sbom --sbom-format cyclonedx --prod > "$SBOM_PATH"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: artifacts/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-artifacts

    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-files

      - name: Publish package tarball
        env:
          TARBALL_PATH: release-files/${{ needs.build-artifacts.outputs.tarball-name }}
        run: |
          if [ ! -f "$TARBALL_PATH" ]; then
            echo "::error::Expected tarball $TARBALL_PATH does not exist"
            exit 1
          fi

          pnpm publish "$TARBALL_PATH" --access public --provenance --no-git-checks

  draft-github-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm

    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-files

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; preserving existing notes."
          else
            cat > release-notes.md <<'EOF'
          TODO: replace this draft text with the reviewed release notes.

          Attached artifacts:
          - npm tarball
          - CycloneDX SBOM
          EOF
            gh release create "$TAG_NAME" --draft --verify-tag --title "$TAG_NAME" --notes-file release-notes.md
          fi

      - name: Attach files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" release-files/* --clobber
